on:
    push:
        branches: [ master ]
    pull_request:
        branches: [ master ]

jobs:
    tag:
        runs-on: ubuntu-linux
        steps:
            - uses: actions/checkout@v3
            - name: pythonsetup
              uses: setup/python@v4
              with: 
                python-version: 3.11
            - name: requirements
              run: /
                    pip install -r requirements.txt
            - name: test
              run: /usr/bin/python3 -m pytest test_app.py